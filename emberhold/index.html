new Wisp(64.8, 0, -2.5);
const boss = new Foe('warden', 99, 0, -PI / 2);
hud.bsn.textContent = DEF.warden.name;
function bossStart() { if (G.bossOn) return; G.bossOn = true; hud.boss.classList.add('on'); bossMusic(true); play('roar', boss.pos, .9); }
function bossDefeated() { G.bossOn = false; G.bossDead = true; bossMusic(false); hud.boss.classList.remove('on'); gate.open = true; gate.seal(false); hazards.length = 0;
  setTimeout(() => { banner('守门者已陨', '灰冕之间重归寂静', 5200); play('win'); }, 900);
  setTimeout(() => { winShrine.show(true); const p = winShrine.pos; ring(p.x, 0, p.z, .4, 4, 1.2, [.8, .55, .25]); sparks(new V3(p.x, .8, p.z), 30, 3, new V3(0, 1, 0), 1, [5, 2.4, .6], 1.4, -1); feed('大厅中央出现了一处灯火'); }, 4200); }

/* ───────────────────────── 灯火、雾门、拾取、掉落的灰烬 ───────────────────────── */
const drop = { pos: new V3(), amt: 0, mesh: new THREE.Mesh(new THREE.OctahedronGeometry(.13, 0), emis([1, .85, .6], 5)), flame: addFlame(0, -50, 0, .7, { col: 'ash', k: 0 }), light: vlight(0, 1, 0, 0xffe0a8, 0, 7) };
drop.mesh.visible = false; scene.add(drop.mesh);
function setDrop(p, n) { drop.amt = n; drop.pos.copy(p); drop.mesh.visible = n > 0; drop.mesh.position.set(p.x, p.y + .7, p.z); drop.flame.x = p.x; drop.flame.y = p.y + .15; drop.flame.z = p.z; drop.flame.k = n > 0 ? 1 : 0; drop.light.pos.set(p.x, p.y + 1, p.z); drop.light.I = n > 0 ? 7 : 0; }
function worldReset() { for (const e of foes) e.reset(); for (const w of wisps) w.reset(); for (const b of bolts) scene.remove(b.m); bolts.length = 0; hazards.length = 0; for (const m of rings) m.visible = false;
  G.bossOn = false; hud.boss.classList.remove('on'); bossMusic(false); gate.open = G.bossDead; gate.seal(false); P.lock = null; }
function respawn() { if (P.ash > 0) setDrop(P.deathPos, P.ash); P.ash = 0; const s = G.spawn; P.pos.set(s.pos.x + Math.sin(s.face) * 1.5, s.pos.y, s.pos.z + Math.cos(s.face) * 1.5); P.face = s.face + PI; P.visY = P.pos.y; P.vel.set(0, 0, 0); P.vy = 0;
  P.hp = P.hpMax; P.sta = P.staMax; P.flasks = P.flaskMax; P.st = 'free'; P.buf = null; P.heal = 0; P.rig.init = false; worldReset(); G.fadeTo = 1; CAM.yaw = s.face; CAM.pitch = .24; CAM.init = false; hudStatic(); film.uniforms.uDamage.value = 0; }
function lvPanel() { $('lvs').textContent = `持有灰烬 ${P.ash}　·　升一级要 ${lvCost()}`; const ok = P.ash >= lvCost();
  const rows = [['lv1', `Lv ${P.lv.vig}　生命 ${P.hpMax} → ${P.hpMax + 18}`], ['lv2', `Lv ${P.lv.end}　耐力 ${P.staMax} → ${P.staMax + 12}`], ['lv3', `Lv ${P.lv.str}　伤害 +${P.lv.str * 9}% → +${P.lv.str * 9 + 9}%`]];
  for (const [id, t] of rows) { const r = $(id); r.querySelector('.v').textContent = t; r.classList.toggle('no', !ok); } }
function levelUp(k) { const c = lvCost(); if (P.ash < c) { feed('灰烬不够'); return; } P.ash -= c; P.lv[k]++; if (k === 'vig') { P.hpMax += 18; P.hp = P.hpMax; } if (k === 'end') { P.staMax += 12; P.sta = P.staMax; } play('ash'); hudStatic(); lvPanel(); }
function interact() {
  if (G.state !== 'play') return;

  if (n.type === 'shrine') { const s = n.obj; P.face = Math.atan2(s.pos.x - P.pos.x, s.pos.z - P.pos.z);
    if (!s.lit) { s.setLit(true); G.spawn = s; play('light', s.pos); banner('灯火已燃', s.name, 3000); sparks(new V3(s.pos.x, .8, s.pos.z), 40, 3, new V3(0, 1, 0), 1, [5, 2.4, .6], 1.4, -1); flash(new V3(s.pos.x, 1.2, s.pos.z), 0xff8a3c, 30, .6, 10);
      if (s === winShrine) { G.won = true; setTimeout(endScreen, 3600); } return; }
    G.spawn = s; P.st = 'rest'; P.hp = P.hpMax; P.sta = P.staMax; P.flasks = P.flaskMax; worldReset(); hudStatic(); lvPanel(); $('lvl').classList.add('on'); play('light', s.pos, .5); }

}
function updateWorldLogic(dt) {

  if (!gate.open && !G.bossOn && P.pos.x > 72.6 && P.pos.x < 75.3 && Math.abs(P.pos.z) < 1.9) near = { type: 'gate', text: '穿过雾门' };
  for (const p of pickups) if (!p.taken) { p.mesh.rotation.y += dt * 1.4; p.mesh.position.y = 1.5 + Math.sin(TIME * 2) * .05; if (Math.hypot(P.pos.x - p.pos.x, P.pos.z - p.pos.z) < 1.6) near = { type: 'pick', obj: p, text: '拾取 瓶之碎片' }; }

  if (pt !== hud._p) { hud._p = pt; if (pt) hud.prompt.innerHTML = (G.near ? '<b>E</b>' : '') + pt; hud.prompt.style.opacity = pt ? 1 : 0; }
  const q = zoneAt(P.pos.x, P.pos.z); if (q && q.id !== G.zoneId) { G.zoneId = q.id; setSpots(q.spots); if (!q.seen && q.title) { q.seen = true; zoneTitle(q.title); } }
}

/* ───────────────────────── 镜头 ───────────────────────── */
const CAM = { yaw: -PI / 2, pitch: .24, dist: 4.4, cur: 4.4, pv: new V3(), look: new V3(), init: false };
function toggleLock() { if (G.state !== 'play') return; if (P.lock) { P.lock = null; return; }
  let best = null, bs = 1e9; const fx = -Math.sin(CAM.yaw), fz = -Math.cos(CAM.yaw);
  for (const e of targets) { if (!e.alive) continue; const dx = e.pos.x - P.pos.x, dz = e.pos.z - P.pos.z, d = Math.hypot(dx, dz); if (d > 18 || d < .01) continue; const dot = (dx * fx + dz * fz) / d; if (dot < .15) continue;
    if (!los(P.pos.x, P.pos.y + 1.5, P.pos.z, e.pos.x, e.lockY, e.pos.z)) continue; const sc = d * (1.7 - dot); if (sc < bs) { bs = sc; best = e; } }
  P.lock = best; if (!best) CAM.snap = .35; }
const _dir = new V3(), _lk = new V3(), _pvT = new V3(), _prj = new V3();
function updateCamera(dt) {
  if (G.state === 'menu') { const a = TIME * .06 + 2.2; camera.position.set(35.4 + Math.cos(a) * 9, 2.3 + Math.sin(TIME * .1) * .5, Math.sin(a) * 6.4); camera.lookAt(35.4, 2.2, 0); mdx = mdy = 0; return; }
  if (G.state === 'play' && P.st !== 'rest') { CAM.yaw -= mdx * .0024; CAM.pitch = clamp(CAM.pitch + mdy * .0024, -.45, 1.15); } mdx = mdy = 0;
  const t = P.lock;
  if (t) { CAM.yaw = dampAng(CAM.yaw, Math.atan2(P.pos.x - t.pos.x, P.pos.z - t.pos.z), 6, dt); CAM.pitch = damp(CAM.pitch, clamp(.36 - (t.lockY - P.pos.y - 1.3) * .07, .12, .5), 4, dt); }
  else if (CAM.snap > 0) { CAM.snap -= dt; CAM.yaw = dampAng(CAM.yaw, P.face + PI, 9, dt); }
  _pvT.set(P.pos.x, P.visY + 1.55, P.pos.z);
  if (!CAM.init) { CAM.pv.copy(_pvT); CAM.look.copy(_pvT); CAM.init = true; CAM.cur = CAM.dist; } else CAM.pv.lerp(_pvT, 1 - Math.exp(-14 * dt));

  const want = G.bossOn ? 5.6 : CAM.dist, h = rayBoxes(CAM.pv.x, CAM.pv.y, CAM.pv.z, _dir.x, _dir.y, _dir.z, want + .35), d = h >= 0 ? Math.max(.7, h - .3) : want;

  if (t) _lk.set(lerp(CAM.pv.x, t.pos.x, .35), lerp(CAM.pv.y, t.lockY, .35), lerp(CAM.pv.z, t.pos.z, .35)); else _lk.copy(CAM.pv);
  CAM.look.lerp(_lk, 1 - Math.exp(-12 * dt)); camera.lookAt(CAM.look);
  if (G.shakeLv > 0 && G.shake > 0) { const s = G.shake * G.shake * (G.shakeLv === 2 ? .09 : .035); camera.position.x += wob(TIME * 31, 1) * s; camera.position.y += wob(TIME * 29, 2) * s; camera.position.z += wob(TIME * 27, 3) * s; }
}
function project(x, y, z) { _prj.set(x, y, z).project(camera); return _prj.z > 1 ? null : [(_prj.x * .5 + .5) * innerWidth, (-_prj.y * .5 + .5) * innerHeight]; }
function updateHud(dt) {
  hud.hpb.style.width = clamp(P.hp / P.hpMax * 100, 0, 100) + '%'; hud.hpg.style.width = clamp(P.hp / P.hpMax * 100, 0, 100) + '%'; hud.stb.style.width = clamp(P.sta / P.staMax * 100, 0, 100) + '%';
  if (G.bossOn) { const w = clamp(boss.hp / DEF.warden.hp * 100, 0, 100) + '%'; hud.bsb.style.width = w; hud.bsg.style.width = w; }
  const t = P.lock; if (t) { const s = project(t.pos.x, t.lockY, t.pos.z); if (s) { hud.lock.style.left = s[0] + 'px'; hud.lock.style.top = s[1] + 'px'; } hud.lock.style.opacity = s ? 1 : 0; } else hud.lock.style.opacity = 0;

    const b = ebars[bi++]; b.style.display = 'block'; b.style.left = s[0] + 'px'; b.style.top = s[1] + 'px'; b.firstChild.style.width = clamp(e.hp / (e.def ? e.def.hp : 46) * 100, 0, 100) + '%'; }
  for (; bi < ebars.length; bi++) ebars[bi].style.display = 'none';
}

/* ───────────────────────── 主循环 ───────────────────────── */
function updateGame(dt) {
  G.fade = damp(G.fade, G.fadeTo, 3, dt); film.uniforms.uFade.value = G.fade;
  film.uniforms.uDamage.value = Math.max(0, film.uniforms.uDamage.value - dt * 1.5); film.uniforms.uLow.value = damp(film.uniforms.uLow.value, P.st === 'dead' ? 1 : clamp((35 - P.hp / P.hpMax * 100) / 35, 0, 1) * .8, 4, dt);
  G.shake = Math.max(0, G.shake - dt * 2.4);
  if (G.state === 'pause') { mdx = mdy = 0; return; }
  if (G.state === 'play') { G.time += dt; let sdt = dt; if (G.hs > 0) { G.hs -= dt; sdt = dt * .05; }
    updatePlayer(sdt); for (const e of foes) e.update(sdt); for (const w of wisps) w.update(sdt); updateBolts(sdt); updateHazards(sdt); updateWorldLogic(dt); updateHud(dt); }
  else { for (const e of foes) e.update(dt); for (const w of wisps) w.update(dt); if (G.state === 'end') { P.pose.set(PC.B); applyPose(P.rig, P.pose, 6, dt); } }

    if (l.positionX) { l.positionX.value = cp.x; l.positionY.value = cp.y; l.positionZ.value = cp.z; l.forwardX.value = _dir.x; l.forwardY.value = _dir.y; l.forwardZ.value = _dir.z; l.upX.value = 0; l.upY.value = 1; l.upZ.value = 0; } else { l.setPosition(cp.x, cp.y, cp.z); l.setOrientation(_dir.x, _dir.y, _dir.z, 0, 1, 0); } }
}
updaters.push(updateGame);
let dripT = 3; updaters.push(dt => { dripT -= dt; if (dripT <= 0) { dripT = rr(2.5, 7); if (G.state === 'play') play('drip', new V3(P.pos.x + rr(-9, 9), 0, P.pos.z + rr(-9, 9)), rr(.4, 1)); } });

function startGame() { initAudio(); G.state = 'play'; $('menu').classList.add('hide'); $('hud').classList.add('on'); hudStatic(); CAM.init = false; CAM.yaw = -PI / 2; lock(); setTimeout(() => zoneTitle('无名囚室'), 600); ZONES[0].seen = true; }

function pause() { if (G.state !== 'play') return; G.state = 'pause'; $('mt').innerHTML = '暂 <span>停</span>'; $('ms').textContent = 'EMBERHOLD'; $('mstat').style.display = 'none'; $('go').textContent = '继续'; $('menu').classList.remove('hide'); }
function endScreen() { G.state = 'end'; if (document.pointerLockElement) document.exitPointerLock(); $('lvl').classList.remove('on');
  const mm = Math.floor(G.time / 60), ss = String(Math.floor(G.time % 60)).padStart(2, '0');
  $('mt').innerHTML = '第一关 <span>完</span>'; $('ms').textContent = '守门者已陨 · 前路未开'; $('mstat').textContent = `用时　${mm}:${ss}\n阵亡　${G.deaths} 次　　　击倒　${G.kills}`; $('mstat').style.display = 'block'; $('go').textContent = '再来一次'; $('menu').classList.remove('hide'); $('hud').classList.remove('on'); }
$('go').addEventListener('click', () => { $('go').blur(); if (G.state === 'end') { location.reload(); return; } if (G.state === 'pause') resume(); else if (G.state === 'menu') startGame(); });
canvas.addEventListener('click', () => { if (G.state === 'play' && !locked) lock(); });

/* ───────────────────────── 开机：烘环境、预热、调试口 ───────────────────────── */
resize(); applyQuality();
P.rig.root.position.copy(P.pos); P.rig.root.rotation.y = P.face; P.pose.set(PC.B); applyPose(P.rig, P.pose, 9, .016);
for (const e of foes) e.update(.016);
setSpots(['hallShaft', 'hallFlood'], true); assignLights(new V3(33, 2, 0)); bakeEnv(new V3(31.5, 2.6, 2.2));
{ // 预热：把所有着色器先编一遍，免得第一刀、第一次爆炸卡顿
  const vis = [], show = o => { vis.push([o, o.visible]); o.visible = true; }; [...puffs, ...debris, ...rings, drop.mesh].forEach(show);
  const bm = new THREE.Mesh(boltGeo, boltMat); bm.position.set(34, 2, 1); scene.add(bm);
  camera.position.set(27, 2.2, 4); camera.lookAt(36, 1.8, 0); camera.updateMatrixWorld(); renderFrame();
  scene.remove(bm); for (const [o, v] of vis) o.visible = v; }
setSpots(['cell'], true); G.zoneId = 'cell';

let manual = URLP.has('manual'), last = performance.now(), frames = 0, ftAvg = 16, slowT = 0;
function tick(dt) { TIME += dt; for (const u of updaters) u(dt); }

  if (!SOFT && !URLP.has('noscale') && frames > 120) { if (ftAvg > 24) { slowT += dt; if (slowT > 2 && Q.scale > .6) { Q.scale = Math.max(.6, Q.scale - .14); slowT = 0; resize(); applyQuality(); } } else slowT = 0; }
}
window.__dbg = { THREE, scene, camera, renderer, P, G, CAM, Q, foes, wisps, boss, gate, shrines, colliders, PATK, DEF, keys, film, bloom,
  start() { G.state = 'play'; locked = true; $('menu').classList.add('hide'); $('hud').classList.add('on'); hudStatic(); CAM.init = false; ZONES[0].seen = true; },
  tp(x, z, y = 0) { P.pos.set(x, y, z); P.visY = y; P.vel.set(0, 0, 0); CAM.init = false; },
  act(a) { P.buf = { a, t: TIME }; }, interact, lockOn: toggleLock, type(s) { for (const ch of s) window.dispatchEvent(new KeyboardEvent('keydown', { key: ch, code: 'Key' + ch.toUpperCase() })); },
  step(dt = 1 / 60, n = 1) { manual = true; for (let i = 0; i < n; i++) tick(dt); renderFrame(); return +TIME.toFixed(2); },
  auto() { manual = false; last = performance.now(); },

  PC, PS, CL, sampleClip, applyPose,
  st: () => ({ state: G.state, st: P.st, hp: +P.hp.toFixed(1), sta: +P.sta.toFixed(0), ash: P.ash, flasks: P.flasks, pos: P.pos.toArray().map(v => +v.toFixed(2)), zone: G.zoneId, lock: P.lock ? (P.lock.def ? P.lock.def.name : '灯芯') : null, boss: { hp: boss.hp, st: boss.st, phase: boss.phase, on: G.bossOn }, foes: foes.map(e => e.def.rig[0] + ':' + e.st + ':' + Math.round(e.hp)).join(' ') }),

};
$('load').classList.add('hide'); $('menu').classList.remove('hide');
requestAnimationFrame(loop);
