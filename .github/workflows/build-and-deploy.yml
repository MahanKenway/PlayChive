name: Build PLAYCHIVE WASM & Deploy

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: write
  pages:    write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      # Job-level so the Cloudflare step's `if` can see whether the secret exists.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
    - uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Cache Emscripten SDK
      id: cache-emsdk
      uses: actions/cache@v4
      with:
        path: emsdk
        key: emsdk-dual-3.1.51-3.1.6

    - name: Install Emscripten SDK
      if: steps.cache-emsdk.outputs.cache-hit != 'true'
      run: |
        git clone https://github.com/emscripten-core/emsdk.git
        ./emsdk/emsdk install 3.1.51
        ./emsdk/emsdk activate 3.1.51

    - name: Add emcc to PATH
      run: echo "$GITHUB_WORKSPACE/emsdk/upstream/emscripten" >> $GITHUB_PATH

    - name: Download redistributable WAD bundles
      run: |
        mkdir -p dist/assets dist/assets/licenses
        curl -fsSL --retry 2 "https://github.com/freedoom/freedoom/releases/download/v0.13.0/freedoom-0.13.0.zip" -o freedoom.zip
        curl -fsSL --retry 2 "https://github.com/freedoom/freedoom/releases/download/v0.13.0/freedm-0.13.0.zip" -o freedm.zip
        # Hacx 1.2 is royalty-free but strictly non-commercial. Its official
        # release archive is vendored after checksum verification so CI does not
        # depend on a slow third-party host at deploy time.
        cp third_party/hacx/hacx12.zip hacx12.zip
        printf '%s  %s\n' '70d25e8f4b48906759db32213927859a99b3b045d3291d468357b225d64cbf8b' hacx12.zip | sha256sum -c -
        unzip -j freedoom.zip "*/freedoom1.wad" "*/freedoom2.wad" -d dist/assets/
        unzip -j freedm.zip "*/freedm.wad" -d dist/assets/
        unzip -p hacx12.zip HACX.WAD > dist/assets/hacx.wad
        unzip -p hacx12.zip HACX.TXT > dist/assets/licenses/HACX-README.txt
        for wad in freedoom1.wad freedoom2.wad freedm.wad hacx.wad; do
          test -s "dist/assets/$wad" || { echo "FATAL: $wad missing"; exit 1; }
        done
        test -s dist/assets/licenses/HACX-README.txt || { echo "FATAL: Hacx README missing"; exit 1; }

    - name: Patch source files
      working-directory: linuxdoom-1.10
      run: python3 patch_web.py

    - name: Compile DOOM -> WASM
      working-directory: linuxdoom-1.10
      run: |
        mkdir -p ../dist/wasm
        PORTABLE=$(ls *.c | grep -vE '^(i_video|i_sound|i_system|i_main|i_net)\.c$' | tr '\n' ' ')
        WEB="web/i_video_web.c web/i_sound_web.c web/i_system_web.c web/i_net_stub.c web/i_main_web.c web/w_io_web.c"

        emcc $PORTABLE $WEB \
          -o ../dist/wasm/doom.wasm \
          -O2 -w -I. \
          -DNORMALUNIX \
          -s WASM=1 \
          -s STANDALONE_WASM=1 \
          -s INITIAL_MEMORY=33554432 \
          -s ALLOW_MEMORY_GROWTH=1 \
          -s EXPORTED_FUNCTIONS='["_initGame","_tickGame","_reportKeyDown","_reportKeyUp"]' \
          -s ERROR_ON_UNDEFINED_SYMBOLS=0 \
          --no-entry

        test -f ../dist/wasm/doom.wasm || { echo "FATAL: doom.wasm not produced"; exit 1; }
        ls -lh ../dist/wasm/doom.wasm

    - name: Compile OpenResident WebGL2 probe
      run: |
        mkdir -p dist/openresident
        em++ third_party/openresident-web/main.cpp third_party/openresident-web/render_web.cpp \
          -Ithird_party/openresident-web/include \
          -O2 -DNDEBUG -D__EMSCRIPTEN__=1 \
          -s WASM=1 \
          -s MODULARIZE=1 \
          -s EXPORT_ES6=1 \
          -s EXPORT_NAME=OpenResidentProbe \
          -s MIN_WEBGL_VERSION=2 \
          -s MAX_WEBGL_VERSION=2 \
          -s FULL_ES3=1 \
          -s EXPORTED_FUNCTIONS='["_openresident_web_graphics_probe","_openresident_web_shutdown"]' \
          -s EXPORTED_RUNTIME_METHODS='["cwrap"]' \
          -o dist/openresident/openresident-probe.js
        test -f dist/openresident/openresident-probe.wasm || { echo "FATAL: OpenResident probe WASM not produced"; exit 1; }
        ls -lh dist/openresident/openresident-probe.*

    - name: Compile Obsidian Relay original survival runtime
      run: |
        mkdir -p dist/shadow-station
        em++ third_party/openresident-web/obsidian_relay.cpp third_party/openresident-web/render_web.cpp \
          -Ithird_party/openresident-web/include \
          -O2 -DNDEBUG -D__EMSCRIPTEN__=1 \
          -s WASM=1 \
          -s MODULARIZE=1 \
          -s EXPORT_ES6=1 \
          -s EXPORT_NAME=ObsidianRelay \
          -s MIN_WEBGL_VERSION=2 \
          -s MAX_WEBGL_VERSION=2 \
          -s FULL_ES3=1 \
          -s EXPORTED_FUNCTIONS='["_obsidian_relay_init","_obsidian_relay_resize","_obsidian_relay_set_action","_obsidian_relay_interact","_obsidian_relay_restart","_obsidian_relay_tick","_obsidian_relay_health","_obsidian_relay_cells","_obsidian_relay_phase","_obsidian_relay_prompt","_obsidian_relay_shutdown"]' \
          -s EXPORTED_RUNTIME_METHODS='["cwrap"]' \
          -o dist/shadow-station/obsidian-relay.js
        test -f dist/shadow-station/obsidian-relay.wasm || { echo "FATAL: Obsidian Relay WASM not produced"; exit 1; }
        ls -lh dist/shadow-station/obsidian-relay.*

    - name: Compile C-Dogs SDL independent runtime
      run: ./scripts/build-cdogs-web.sh

    - name: Compile GNU FreeDink independent runtime
      env:
        GH_TOKEN: ${{ github.token }}
      run: ./scripts/build-freedink-web.sh

    - name: Compile OpenTyrian2000 independent runtime
      env:
        GH_TOKEN: ${{ github.token }}
      run: ./scripts/build-opentyrian-web.sh

    - name: Compile LibreQuake independent runtime
      env:
        GH_TOKEN: ${{ github.token }}
      run: ./scripts/build-liberquake-web.sh

    - name: Package OpenTTD fully bundled strategy runtime
      run: ./scripts/build-openttd-web.sh

    - name: Compile FreeRCT fully bundled strategy runtime
      run: ./scripts/build-freerct-web.sh

    - name: Compile Neverball fully bundled physics-puzzle runtime
      env:
        GH_TOKEN: ${{ github.token }}
      run: ./scripts/build-neverball-web.sh

    - name: Package TuxRacer.js fully bundled 3D downhill runtime
      run: ./scripts/build-tuxracer-web.sh

    - name: Package Astray fully bundled 3D physics maze runtime
      run: ./scripts/build-astray-web.sh

    - name: Package Starter Kit Racing fully bundled 3D mesh racing runtime
      run: ./scripts/build-starter-kit-racing-web.sh

    - name: Package HexGL fully bundled 3D racing runtime
      run: ./scripts/build-hexgl-web.sh

    - name: Package Hextris fully bundled arcade-puzzle runtime
      run: ./scripts/build-hextris-web.sh

    - name: Compile Rocks'n'Diamonds fully bundled rock-and-gem runtime
      run: ./scripts/build-rocksndiamonds-web.sh

    - name: Package Beats into Shapes fully bundled rhythm runtime
      run: ./scripts/build-beats-into-shapes-web.sh

    - name: Package A Dark Room fully bundled text-adventure runtime
      run: ./scripts/build-adarkroom-web.sh

    - name: Package 2048 fully bundled arcade-puzzle runtime
      run: ./scripts/build-2048-web.sh

    - name: Package JavaScript Tetris fully bundled arcade-puzzle runtime
      run: ./scripts/build-javascript-tetris-web.sh

    - name: Compile Digger Remastered fully bundled action runtime
      run: ./scripts/build-digger-web.sh

    - name: Compile Blasphemer fully bundled fantasy-shooter runtime
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        # SDL renderer output for Chocolate Heretic is browser-tested with
        # Emscripten 3.1.6; retain 3.1.51 for all established runtimes.
        sudo apt-get update -qq
        sudo apt-get install -y -qq lbzip2
        ./emsdk/emsdk install 3.1.6
        ./emsdk/emsdk activate 3.1.6
        source ./emsdk/emsdk_env.sh
        ./scripts/build-blasphemer-web.sh
        # Emscripten 3.1.6 uses the legacy single `upstream` layout and
        # replaces the active 3.1.51 tool files, so reinstall before restore.
        ./emsdk/emsdk install 3.1.51
        ./emsdk/emsdk activate 3.1.51

    - name: Compile ECWolf local-data runtime
      env:
        GH_TOKEN: ${{ github.token }}
      run: ./scripts/build-ecwolf-web.sh

    - name: Copy frontend files
      run: |
        cp index.html neon-rift.html shadow-station.html tuxracer.html armawebtron.html astray.html starter-kit-racing.html cdogs.html freedink.html opentyrian.html librequake.html openttd.html freerct.html neverball.html blasphemer.html hexgl.html hextris.html rocksndiamonds.html beats-into-shapes.html 2048.html javascript-tetris.html adarkroom.html digger.html ecwolf.html openresident.html coi-serviceworker.js offline-worker.js manifest.json robots.txt sitemap.xml llms.txt agent-manifest.json google*.html dist/ 2>/dev/null || true
        cp -r styles src data agent neon-rift shadow-station tuxracer armawebtron starter-kit-racing privacy dist/ 2>/dev/null || true
        mkdir -p dist/assets
        # Copy nested catalog artwork as well as existing icons. The WADs are
        # downloaded above into dist/assets and remain untouched because the
        # source assets directory contains no bundled archive.
        cp -R assets/. dist/assets/

    - name: Generate complete offline pack manifest
      run: |
        python3 - <<'PY'
        import json
        from pathlib import Path
        root = Path('dist')
        files = []
        total = 0
        for path in sorted(root.rglob('*')):
          if not path.is_file() or path.name == 'offline-manifest.json':
            continue
          rel = path.relative_to(root).as_posix()
          size = path.stat().st_size
          files.append({'url': './' + rel, 'bytes': size})
          total += size
        Path('dist/offline-manifest.json').write_text(json.dumps({
          'schemaVersion': '1.0',
          'name': 'PLAYCHIVE complete offline pack',
          'generatedAt': '${{ github.sha }}',
          'totalBytes': total,
          'files': files,
        }, indent=2) + '\n')
        print(f'Offline pack: {len(files)} files / {total / 1024 / 1024:.1f} MiB')
        PY
        test -s dist/offline-manifest.json

    - name: Cache-bust WAD/WASM URLs with commit SHA
      run: |
        SHA_SHORT=$(echo "${{ github.sha }}" | cut -c1-8)
        sed -i "s#assets/freedoom1\\.wad#assets/freedoom1.wad?v=${SHA_SHORT}#" dist/src/main.js
        sed -i "s#assets/freedoom2\\.wad#assets/freedoom2.wad?v=${SHA_SHORT}#" dist/src/main.js
        sed -i "s#assets/freedm\\.wad#assets/freedm.wad?v=${SHA_SHORT}#" dist/src/main.js
        sed -i "s#assets/hacx\\.wad#assets/hacx.wad?v=${SHA_SHORT}#" dist/src/main.js
        sed -i "s#wasm/doom\\.wasm#wasm/doom.wasm?v=${SHA_SHORT}#" dist/src/main.js

    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: dist/

    - name: Check Cloudflare static asset limits
      run: |
        # Workers Static Assets: max 25 MiB per file, 20,000 files (Free plan).
        echo "File count: $(find dist -type f | wc -l)"
        echo "Files over 25 MiB:"
        find dist -type f -size +25M -exec ls -lh {} \; || true

    - name: Deploy to Cloudflare Workers
      if: ${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && env.CLOUDFLARE_API_TOKEN != '' }}
      continue-on-error: true
      uses: cloudflare/wrangler-action@v3
      env:
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      with:
        apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        command: deploy

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - uses: actions/deploy-pages@v4
      id: deployment
