<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Neon Rift · PLAYCHIVE</title>
<style>
:root{color-scheme:dark;background:#050716}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050716;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}#game{display:block;width:100%;height:100%;outline:0;image-rendering:auto}#hud{position:fixed;inset:0;pointer-events:none;color:#d9fbff;text-shadow:0 2px 0 #071024;letter-spacing:.08em;font-size:12px}#brand{position:absolute;top:18px;left:22px;color:#ff5870;font-size:14px;font-weight:700}#brand b{color:#ffe07a}#stats{position:absolute;top:18px;right:22px;display:grid;grid-template-columns:repeat(3,auto);gap:22px;text-align:right}#stats span{display:block;color:#8aa4bc;font-size:9px;margin-bottom:4px}#stats strong{font-size:16px;color:#f0fbff}#boost{position:absolute;left:22px;bottom:22px;width:180px;height:9px;border:1px solid rgba(209,255,87,.8);background:rgba(0,0,0,.35)}#boost i{display:block;height:100%;width:100%;background:#d7ff57;box-shadow:0 0 15px #d7ff57}#message{position:absolute;inset:0;display:grid;place-items:center;text-align:center}.card{padding:28px 32px;min-width:min(470px,calc(100vw - 42px));border:1px solid rgba(255,88,112,.75);background:rgba(5,7,22,.86);box-shadow:12px 12px 0 rgba(255,88,112,.14)}.card h1{margin:0 0 10px;font-size:clamp(30px,7vw,72px);line-height:.9;color:#fff;letter-spacing:-.08em}.card p{margin:10px auto;max-width:420px;color:#b4cedb;line-height:1.6;font-size:12px}.card .accent{color:#d7ff57}.card .key{display:inline-block;margin-top:14px;padding:10px 18px;border:1px solid #d7ff57;color:#d7ff57;background:#111a23;font-weight:700}.hidden{display:none!important}#status{position:absolute;bottom:22px;right:22px;color:#9ab5c7;font-size:10px;text-align:right}@media(max-width:600px){#stats{gap:9px;right:12px}#brand{left:12px;top:12px}#status{right:12px;bottom:12px;font-size:9px}#boost{left:12px;bottom:14px;width:140px}}
</style>
</head>
<body>
<canvas id="game" tabindex="0" aria-label="Neon Rift 3D retro racer"></canvas>
<div id="hud"><div id="brand">NEON <b>RIFT</b> // 03</div><div id="stats"><div><span>SCORE</span><strong id="score">000000</strong></div><div><span>RIFT</span><strong id="lap">01 / 03</strong></div><div><span>TIME</span><strong id="time">60.0</strong></div></div><div id="boost"><i id="boost-fill"></i></div><div id="status">SYSTEM READY · ARROWS / PSP TOUCH</div><div id="message"><div class="card" id="card"><h1>NEON<br><span class="accent">RIFT</span></h1><p>A handcrafted low-poly night racer. Hit the gates, collect the signal cores and keep your charge through three rifts.</p><div class="key">PRESS ENTER / × TO START</div></div></div></div>
<script src="../hexgl/libs/Three.r53.js"></script>
<script>
(()=>{'use strict';
const canvas=document.getElementById('game'),scoreEl=document.getElementById('score'),lapEl=document.getElementById('lap'),timeEl=document.getElementById('time'),boostFill=document.getElementById('boost-fill'),statusEl=document.getElementById('status'),message=document.getElementById('message'),card=document.getElementById('card');
const keys=new Set();let mode='menu',renderer,scene,camera,player,world=[],gates=[],cores=[],stars=[],fallback=false,last=performance.now(),distance=0,score=0,boost=100,timeLeft=60,hitFlash=0,checkpoint=0,frame=0;
const laneX=[-4.2,0,4.2], TRACK=3600, TOTAL=3;
function say(text){parent.postMessage({type:'retroplay-runtime-status',state:'ready',message:text},location.origin)}
function mat(color,em=0){return new THREE.MeshPhongMaterial({color,emissive:em,shininess:40})}
function cube(w,h,d,m){return new THREE.Mesh(new THREE.CubeGeometry(w,h,d),m)}
function makeScene(){
 scene=new THREE.Scene();scene.fog=new THREE.Fog(0x050716,55,290);scene.add(new THREE.AmbientLight(0x455078,.75));const light=new THREE.PointLight(0xff385f,1.7,190);light.position.set(0,24,12);scene.add(light);const blue=new THREE.PointLight(0x26d9ff,1.2,130);blue.position.set(-32,8,-120);scene.add(blue);
 camera=new THREE.PerspectiveCamera(63,innerWidth/innerHeight,.1,500);camera.position.set(0,7,14);camera.lookAt(0,0,-30);
 const floor=cube(180,.4,500,mat(0x070b20));floor.position.set(0,-3,-180);scene.add(floor);
 for(let i=0;i<70;i++){const s=cube(.22+Math.random()*.7,.22+Math.random()*.7,.22+Math.random()*.7,mat(i%3?0x263452:0xffca55));s.position.set((Math.random()-.5)*150,18+Math.random()*42,-Math.random()*430);scene.add(s);stars.push(s)}
 for(let i=0;i<72;i++){const z=-i*TRACK/72-10,seg=cube(18,.35,TRACK/72+.3,mat(i%2?0x11183b:0x0d1230));seg.position.set(0,-2.8,z);scene.add(seg);world.push(seg);const line=cube(.18,.04,TRACK/72*.52,mat(0x31e7ff,0x174b5d));line.position.set(0,-2.55,z);scene.add(line);world.push(line);for(const x of [-10.4,10.4]){const rail=cube(.3,1.8,TRACK/72+.3,mat(i%2?0xf13d76:0x563dff));rail.position.set(x,-1.2,z);scene.add(rail);world.push(rail)} }
 for(let i=0;i<26;i++){const z=-70-i*137;for(const side of [-1,1]){const h=5+Math.random()*20,w=3+Math.random()*5,b=cube(w,h,5,mat(i%2?0x16234b:0x241a4f));b.position.set(side*(17+Math.random()*16),h/2-2.7,z);scene.add(b);world.push(b);}}
 for(let i=0;i<18;i++){const z=-85-i*193,g=cube(1.2,8,1.2,mat(0xff4c8a,0xff173a));g.position.set(laneX[i%3],1.5,z);scene.add(g);gates.push({mesh:g,z:Math.abs(z),lane:i%3,hit:false});const core=new THREE.Mesh(new THREE.OctahedronGeometry(1.05,.1),mat(0xd7ff57,0x6e8c18));core.position.set(laneX[(i+1)%3],1.5,z-32);scene.add(core);cores.push({mesh:core,z:Math.abs(z-32),lane:(i+1)%3,taken:false});}
 player=cube(2.4,.7,4.6,mat(0xff5774,0x8b1e3c));player.position.set(0,-1.3,5);scene.add(player);const wing=cube(6,.12,1.1,mat(0x354c82));wing.position.set(0,-1.25,5);scene.add(wing);player.userData.wing=wing;
}
function init(){try{if(!window.THREE)throw Error('Three unavailable');renderer=new THREE.WebGLRenderer({canvas,antialias:false,alpha:false});renderer.setSize(innerWidth,innerHeight);renderer.setClearColor(0x050716,1);makeScene();}catch(e){fallback=true;initFallback();}say('READY Neon Rift is running. Press Enter or × to start.');requestAnimationFrame(loop)}
let ctx;
function initFallback(){ctx=canvas.getContext('2d');statusEl.textContent='SYSTEM READY · CANVAS FALLBACK';}
function start(){if(mode==='race')return;mode='race';distance=0;score=0;boost=100;timeLeft=60;checkpoint=0;hitFlash=0;message.classList.add('hidden');statusEl.textContent='RIFT 01 ACTIVE · STEER / BOOST / COLLECT';say('READY Neon Rift race active.');}
function reset(){mode='menu';message.classList.remove('hidden');card.innerHTML='<h1>NEON<br><span class="accent">RIFT</span></h1><p>Three rifts. One charge. Press enter or the PSP cross button to launch the original low-poly night race.</p><div class="key">PRESS ENTER / × TO START</div>';say('READY Neon Rift is running. Press Enter or × to start.');}
function finish(){mode='result';message.classList.remove('hidden');card.innerHTML='<h1>RIFT<br><span class="accent">CLEARED</span></h1><p>Signal locked. Final score: <b>'+String(score).padStart(6,'0')+'</b>. Press R or × to run the route again.</p><div class="key">PRESS R / × TO RESTART</div>';statusEl.textContent='FINISH LINE · SCORE LOCKED';}
function update(dt){if(mode!=='race')return;const left=keys.has('ArrowLeft'),right=keys.has('ArrowRight'),up=keys.has('ArrowUp')||keys.has('Space')||keys.has('KeyZ'),down=keys.has('ArrowDown');const target=(right?1:0)-(left?1:0);player.position.x+=target*dt*12;player.position.x=Math.max(-7.2,Math.min(7.2,player.position.x));const boosting=up&&boost>0;const speed=(boosting?52:34)*(down?.55:1);if(boosting)boost=Math.max(0,boost-dt*30);else boost=Math.min(100,boost+dt*8);distance+=speed*dt;timeLeft-=dt;if(timeLeft<=0||distance>=TRACK*TOTAL){finish();return;}const lap=Math.min(TOTAL,Math.floor(distance/TRACK)+1);lapEl.textContent=String(lap).padStart(2,'0')+' / 03';timeEl.textContent=Math.max(0,timeLeft).toFixed(1);scoreEl.textContent=String(score).padStart(6,'0');boostFill.style.width=boost+'%';player.rotation.z=-target*.12;player.userData.wing.rotation.z=target*.08;
 for(const o of world){o.position.z+=speed*dt;if(o.position.z>45)o.position.z-=TRACK;}
 for(const s of stars){s.position.z+=speed*dt*.35;if(s.position.z>30)s.position.z-=460;}
 for(const g of gates){g.mesh.position.z+=speed*dt;if(g.mesh.position.z>35){g.mesh.position.z-=TRACK;g.hit=false;}const dz=Math.abs(g.mesh.position.z-5);if(dz<2.4&&Math.abs(player.position.x-g.mesh.position.x)<1.8&&!g.hit){g.hit=true;hitFlash=.3;timeLeft-=2;statusEl.textContent='GATE HIT · -2.0 SEC';}}
 for(const c of cores){c.mesh.position.z+=speed*dt;if(c.mesh.position.z>35){c.mesh.position.z-=TRACK;c.taken=false;}const dz=Math.abs(c.mesh.position.z-5);if(dz<2.3&&Math.abs(player.position.x-c.mesh.position.x)<2&&!c.taken){c.taken=true;score+=500;boost=Math.min(100,boost+22);statusEl.textContent='SIGNAL CORE +500 · CHARGE RESTORED';}}
 if(Math.floor(distance/600)>checkpoint){checkpoint=Math.floor(distance/600);score+=250;statusEl.textContent='CHECKPOINT '+checkpoint+' / 09 · +250';}hitFlash=Math.max(0,hitFlash-dt);
}
function drawFallback(){const w=canvas.width=innerWidth*devicePixelRatio,h=canvas.height=innerHeight*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);const W=innerWidth,H=innerHeight;ctx.fillStyle='#050716';ctx.fillRect(0,0,W,H);const grd=ctx.createLinearGradient(0,0,0,H);grd.addColorStop(0,'#111a43');grd.addColorStop(1,'#050716');ctx.fillStyle=grd;ctx.fillRect(0,0,W,H);for(let i=0;i<15;i++){const y=H*.33+(i/15)**1.7*H*.67;const half=(y/H)*W*.48;ctx.fillStyle=i%2?'#12183b':'#0c1230';ctx.fillRect(W/2-half,y,W*0.96*(y/H),H/18);ctx.strokeStyle='#29dcea';ctx.strokeRect(W/2-half,y,W*0.96*(y/H),1)}ctx.fillStyle='#ff5774';ctx.beginPath();ctx.moveTo(W/2,H*.74);ctx.lineTo(W/2-55,H*.9);ctx.lineTo(W/2-20,H*.86);ctx.lineTo(W/2,H*.72);ctx.lineTo(W/2+20,H*.86);ctx.lineTo(W/2+55,H*.9);ctx.closePath();ctx.fill();ctx.fillStyle='#d7ff57';ctx.fillRect(W/2-8,H*.82,16,26);if(hitFlash){ctx.fillStyle='rgba(255,65,90,.35)';ctx.fillRect(0,0,W,H)}}
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;update(dt);if(!fallback){camera.position.x+=(player.position.x*.22-camera.position.x)*.08;camera.lookAt(player.position.x*.1,0,-30);renderer.render(scene,camera)}else drawFallback();if(hitFlash){canvas.style.filter='brightness(1.5) saturate(1.5)';}else canvas.style.filter='';requestAnimationFrame(loop)}
addEventListener('resize',()=>{if(renderer){renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()}});addEventListener('keydown',e=>{keys.add(e.code);if(['Enter','KeyZ'].includes(e.code)){e.preventDefault();if(mode==='menu')start();else if(mode==='result')reset();}if(e.code==='KeyR'){e.preventDefault();reset();}if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault()});addEventListener('keyup',e=>keys.delete(e.code));canvas.addEventListener('pointerdown',()=>canvas.focus());init();
})();
</script>
</body>
</html>
